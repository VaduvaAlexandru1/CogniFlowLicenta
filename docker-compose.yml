version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: CogniFlow_admin
      POSTGRES_PASSWORD: CogniFlow_pass
      POSTGRES_DB: CogniFlow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: